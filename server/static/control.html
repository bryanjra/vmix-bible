<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>vMix Bible — control</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f2630;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b96a3;
    --accent: #4a9eff;
    --danger: #d05050;
    --ok: #2fc16b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .title { font-weight: 600; letter-spacing: 0.02em; }
  header .conn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
  }
  header .conn.live { color: var(--ok); }
  header .conn.dead { color: var(--danger); }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  .now {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .now .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .now .ref {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .now .text {
    font-size: 19px;
    line-height: 1.45;
    color: #d8e0e8;
  }
  .now.empty .ref { color: var(--muted); font-weight: 400; }
  .now.empty .text { color: var(--muted); font-style: italic; }

  .position {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 4px 0 14px;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .controls button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 22px 12px;
    font-size: 22px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    transition: transform 80ms ease, background 120ms ease;
  }
  .controls button:active { transform: scale(0.98); background: #2a3340; }
  .controls .full { grid-column: 1 / -1; }
  .controls .danger { color: #ffd0d0; border-color: #4a2a2a; background: #2b1c1c; }
  .controls .danger:active { background: #3a2424; }

  .next-up {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.4;
  }
  .next-up .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .next-up .ref { color: var(--text); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="title">vMix Bible — control</div>
  <div class="conn dead" id="conn">offline</div>
</header>
<main>
  <div class="now empty" id="now">
    <div class="label">Now showing</div>
    <div class="ref" id="now-ref">— nothing —</div>
    <div class="text" id="now-text">Push a verse from the CLI to begin.</div>
  </div>

  <div class="position" id="position">—</div>

  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <button class="full danger" id="clear">Clear screen</button>
  </div>

  <div class="next-up" id="next-up" style="display:none">
    <div class="label">Up next</div>
    <div class="ref" id="up-ref"></div>
    <div id="up-text"></div>
  </div>
</main>

<script>
(() => {
  const $conn = document.getElementById("conn");
  const $now = document.getElementById("now");
  const $nowRef = document.getElementById("now-ref");
  const $nowText = document.getElementById("now-text");
  const $position = document.getElementById("position");
  const $nextUp = document.getElementById("next-up");
  const $upRef = document.getElementById("up-ref");
  const $upText = document.getElementById("up-text");

  let state = null;
  let ws = null;
  let backoff = 250;

  function render(s) {
    state = s;
    if (!s.current) {
      $now.classList.add("empty");
      $nowRef.textContent = "— nothing —";
      $nowText.textContent = "Push a verse from the CLI to begin.";
      $position.textContent = "—";
      $nextUp.style.display = "none";
      return;
    }
    $now.classList.remove("empty");
    $nowRef.textContent = `${s.current.book} ${s.current.chapter}:${s.current.verse}`;
    $nowText.textContent = s.current.text;
    $position.textContent = `${s.index + 1} / ${s.total}` + (s.reference ? `  ·  ${s.reference}` : "");
    if (s.next) {
      $nextUp.style.display = "block";
      $upRef.textContent = `${s.next.book} ${s.next.chapter}:${s.next.verse}`;
      $upText.textContent = s.next.text;
    } else {
      $nextUp.style.display = "none";
    }
  }

  function send(cmd) {
    if (ws && ws.readyState === 1) ws.send(cmd);
  }

  document.getElementById("next").onclick  = () => send("next");
  document.getElementById("prev").onclick  = () => send("prev");
  document.getElementById("clear").onclick = () => {
    if (confirm("Clear the projection?")) send("clear");
  };

  // Keyboard for laptop use
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); send("next"); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); send("prev"); }
    else if (e.key === "Escape") { e.preventDefault(); send("clear"); }
  });

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/live`);
    ws.onopen = () => {
      backoff = 250;
      $conn.textContent = "live";
      $conn.classList.remove("dead");
      $conn.classList.add("live");
    };
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data && data.type === "state") render(data);
      } catch {}
    };
    ws.onclose = () => {
      $conn.textContent = "reconnecting…";
      $conn.classList.remove("live");
      $conn.classList.add("dead");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 3000);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();
})();
</script>
</body>
</html>
